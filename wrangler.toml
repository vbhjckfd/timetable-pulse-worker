name = "timetable-pulse"
main = "src/index.js"
compatibility_date = "2024-09-23"

# The frontend and API both build against the custom domain below, so the
# workers.dev hostname is closed.  Reaching the Worker now requires going
# through the lad.lviv.ua zone, which is what puts it behind WAF rules, Rate
# Limiting Rules and Bot Fight Mode instead of bypassing all of them.
workers_dev = false

# The custom domain puts the Worker on the lad.lviv.ua zone, which is what makes
# zone-level protection reachable at all: WAF custom rules, Rate Limiting Rules,
# Bot Fight Mode and Turnstile are all zone features and none of them apply to a
# *.workers.dev hostname.  It also survives the corporate and mobile networks
# that blanket-block workers.dev.
[[routes]]
pattern = "pulse.lad.lviv.ua"
custom_domain = true

[vars]
# New Relic EU account. The ingest licence key itself is a secret:
#   wrangler secret put NEW_RELIC_LICENSE_KEY
NEW_RELIC_ACCOUNT_ID = "3352365"

[[durable_objects.bindings]]
name = "PULSE_ROOM"
class_name = "PulseRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PulseRoom"]

# Applied per client IP to the public surface only — see src/index.js, which
# exempts the authenticated /signal producer.
#
# Keyed on IP, and Ukrainian mobile carriers put many subscribers behind one
# CGNAT address, so the budget is shared by strangers rather than spent by one
# person.  /ws costs one connection per tab, so 30/minute still caps a client
# stuck in a reconnect loop while leaving room for a dozen real users sharing an
# address.  No legitimate client has been limited at 10 — this is headroom, not
# a fix.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1"
simple = { limit = 30, period = 60 }
